<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>Pushpstation slash transition</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link rel="stylesheet" href="brand.css" />
  <style>
    #mid { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    #em-wrap { position: relative; width: 170px; height: 170px; }
    #em { position: relative; width: 170px; height: 170px; }
    #em > span { font-size: 130px; }
  </style>
</head>
<body>
  <!-- cut between the two clips at 0.46 s: the frame is fully covered 0.40-0.52 s -->
  <div id="root" data-composition-id="transition" data-start="0" data-duration="1" data-width="1920" data-height="1080">
    <div id="grp" class="clip" data-start="0" data-duration="1" style="position:absolute;inset:0">
      <div class="wipe"><div id="slab" class="slab"></div></div>
      <div id="mid"><div id="em-wrap"><div id="em" class="emblem"><span>P</span></div></div></div>
    </div>
  </div>
  <script src="brand.js"></script>
  <script>
    document.fonts.ready.then(() => {
      buildSlabs();
      const tl = gsap.timeline({ paused: true });
      slabIn(tl, "#slab", 0, 0.4);
      tl.fromTo("#em-wrap", { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.2, ease: "back.out(2)" }, 0.3);
      tl.to("#em-wrap", { scale: 0, rotation: 90, duration: 0.14, ease: "power3.in" }, 0.5);
      slabOut(tl, "#slab", 0.52, 0.42);
      window.__timelines["transition"] = tl;
    });
  </script>
</body>
</html>
