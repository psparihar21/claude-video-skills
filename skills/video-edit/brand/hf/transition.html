<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"shape","type":"enum","label":"Shape","default":"circle","options":[{"value":"triangle","label":"Triangle"},{"value":"circle","label":"Circle"},{"value":"cross","label":"Cross"},{"value":"square","label":"Square"}]}
]'>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <meta name="description" content="Pushpstation section transition, 16:9" />
  <title>Pushpstation transition</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link rel="stylesheet" href="brand.css" />
  <style>
    #wall { top: -40px; }
    #mark { left: 860px; top: 440px; width: 200px; height: 200px; }
    #ring { position: absolute; inset: 0; overflow: visible; }
  </style>
</head>
<body>
  <!-- cut between the two clips at 0.46 s: the frame is fully covered 0.36-0.52 s -->
  <div id="root" data-composition-id="transition" data-start="0" data-duration="1" data-width="1920" data-height="1080">
    <div id="grp" class="clip" data-start="0" data-duration="1" style="position:absolute;inset:0">
      <div id="cover" class="cover">
        <div id="wall" class="wall"></div>
        <div id="mark" class="mark"></div>
      </div>
      <svg id="ring" aria-hidden="true" viewBox="0 0 1920 1080"><path id="ring-p" d="M0 0Z" /></svg>
    </div>
  </div>
  <script src="brand.js"></script>
  <script>
    document.fonts.ready.then(() => {
      const v = (window.__hyperframes && window.__hyperframes.getVariables()) || {};
      const shape = ["triangle", "circle", "cross", "square"].includes(v.shape) ? v.shape : "circle";
      document.getElementById("wall").innerHTML = wallMarkup("Pushpstation", 7, 150);
      document.getElementById("mark").innerHTML = markMarkup(200);
      const tl = gsap.timeline({ paused: true });
      shapeCover(tl, "#cover", "#ring-p", shape, 1920, 1080, 0, 0.36, 0.52, 0.42);
      wallDrift(tl, "#wall", 0, 1, 300);
      tl.fromTo("#mark > svg", { scale: 0, rotation: -120, transformOrigin: "50% 50%" }, { scale: 1, rotation: 0, duration: 0.2, ease: "back.out(2)", stagger: 0.025 }, 0.28);
      tl.to("#mark > svg", { scale: 0, rotation: 120, duration: 0.12, ease: "power3.in", stagger: 0.02 }, 0.5);
      window.__timelines["transition"] = tl;
    });
  </script>
</body>
</html>
