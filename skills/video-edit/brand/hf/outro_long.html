<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"left","type":"string","label":"Left slot label","default":"Watch next"},
  {"id":"right","type":"string","label":"Right slot label","default":"Best video"},
  {"id":"next","type":"string","label":"Top-right note","default":"More gameplay soon"}
]'>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <meta name="description" content="Pushpstation end screen, 15 s" />
  <title>Pushpstation end screen</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link rel="stylesheet" href="brand.css" />
  <style>
    /* YouTube end-screen slots, measured from Studio (2026-10-29): videos 640x360 at (135,190) and (1145,190); subscribe circle centred (960,750), d about 300 */
    #wall { top: -10px; }
    #mark { left: 135px; top: 40px; width: 110px; height: 110px; }
    #name-wrap { position: absolute; left: 275px; top: 56px; }
    #name { font-size: 76px; }
    #next { left: auto; right: 135px; top: 62px; height: 76px; font-size: 32px; background: var(--color-volt); color: var(--color-on-volt); box-shadow: 8px 8px 0 var(--color-shade); }
    .slot { position: absolute; width: 640px; height: 360px; border: 8px solid var(--color-ink); background: var(--color-ground-deep); box-shadow: 14px 14px 0 var(--color-coral), 22px 22px 0 var(--color-shade); }
    #sl { left: 135px; top: 190px; } #sr { left: 1145px; top: 190px; }
    #ll { left: 135px; top: 584px; height: 64px; font-size: 32px; background: var(--color-ink); color: var(--color-ground-deep); }
    #rl { left: 1145px; top: 584px; height: 64px; font-size: 32px; background: var(--color-coral); color: var(--color-shade); }
    #orbit { position: absolute; left: 760px; top: 550px; width: 400px; height: 400px; }
    #ring { position: absolute; inset: 0; overflow: visible; }
    #orbit .o { position: absolute; left: 175px; top: 175px; }
    #sub-btn { left: 1180px; top: 860px; height: 76px; font-size: 32px; background: transparent; border: 6px solid var(--color-coral); color: var(--color-ink); font-family: var(--font-display); font-weight: 900; text-transform: uppercase; }
    #ring-p { position: absolute; inset: 0; overflow: visible; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="outro-long" data-start="0" data-duration="15" data-width="1920" data-height="1080">
    <div id="grp" class="clip" data-start="0" data-duration="15" style="position:absolute;inset:0">
      <div id="cover" class="cover">
        <div id="wall" class="wall"></div>
        <div id="mark" class="mark"></div>
        <div id="name-wrap"><div id="name" class="head extrude">Pushpstation</div></div>
        <div id="next" class="tag" data-var-text="next">More gameplay soon</div>
        <div id="sl" class="slot"></div>
        <div id="sr" class="slot"></div>
        <div id="ll" class="tag" data-var-text="left">Watch next</div>
        <div id="rl" class="tag" data-var-text="right">Best video</div>
        <div id="orbit">
          <svg id="ring" aria-hidden="true" viewBox="0 0 400 400"><circle cx="200" cy="200" r="158" style="fill:none;stroke:var(--color-volt);stroke-width:10;stroke-dasharray:28 18" /></svg>
          <div class="o"></div><div class="o"></div><div class="o"></div><div class="o"></div>
        </div>
        <div id="sub-btn" class="tag">Subscribe</div>
      </div>
      <svg id="ring-p" aria-hidden="true" viewBox="0 0 1920 1080"><path id="edge" d="M0 0Z" /></svg>
    </div>
  </div>
  <script src="brand.js"></script>
  <script>
    document.fonts.ready.then(() => {
      document.getElementById("wall").innerHTML = wallMarkup("Pushpstation", 8, 130);
      document.getElementById("mark").innerHTML = markMarkup(110);
      document.querySelectorAll("#orbit .o").forEach((o, i) => (o.innerHTML = shapeSvg(["triangle", "circle", "cross", "square"][i], 50)));
      splitChars("#name");
      const tl = gsap.timeline({ paused: true });
      shapeCover(tl, "#cover", "#edge", "square", 1920, 1080, 0, 0.42, null, 0);
      wallDrift(tl, "#wall", 0, 15, 1600);
      markIn(tl, "#mark", 0.36);
      charsIn(tl, "#name", 0.42, 0.022);
      tagIn(tl, "#next", 0.8);
      ["#sl", "#sr"].forEach((s, i) => tl.fromTo(s, { scale: 0.6, rotation: i ? 4 : -4, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.5, ease: "back.out(1.6)" }, 0.55 + i * 0.12));
      tagIn(tl, "#ll", 0.95); tagIn(tl, "#rl", 1.05);
      tl.fromTo("#ring", { scale: 0, rotation: -180, transformOrigin: "50% 50%" }, { scale: 1, rotation: 0, duration: 0.6, ease: "back.out(1.6)" }, 1.1);
      tl.fromTo("#ring", { rotation: 0 }, { rotation: 360, duration: 13.3, ease: "none", immediateRender: false }, 1.7);
      // the four shapes orbit the subscribe circle, a quarter turn apart
      const orbit = { a: 0 };
      const place = () => document.querySelectorAll("#orbit .o").forEach((o, i) => {
        const t = orbit.a + i * Math.PI / 2;
        o.style.transform = `translate(${Math.cos(t) * 172}px, ${Math.sin(t) * 172}px) rotate(${orbit.a * 57.3}deg) scale(${orbit.s ?? 1})`;
      });
      orbit.s = 0; place();
      tl.to(orbit, { s: 1, duration: 0.4, ease: "back.out(2)", onUpdate: place }, 1.3);
      tl.to(orbit, { a: Math.PI * 2, duration: 13.3, ease: "none", onUpdate: place }, 1.7);
      tagIn(tl, "#sub-btn", 1.45);
      [5, 10].forEach((t) => tl.to("#sub-btn", { scale: 1.1, duration: 0.14, yoyo: true, repeat: 1, ease: "power2.out" }, t));
      window.__timelines["outro-long"] = tl;
    });
  </script>
</body>
</html>
