<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"note","type":"string","label":"Game name","default":"PS5 Gameplay"},
  {"id":"tag","type":"string","label":"Tag","default":"PS5 gameplay"},
  {"id":"kind","type":"enum","label":"Kind of video","default":"gameplay","options":[{"value":"gameplay","label":"Gameplay (volt)"},{"value":"news","label":"News (coral)"},{"value":"tech","label":"Tech (sky)"}]}
]'>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <meta name="description" content="Pushpstation Shorts intro, 9:16" />
  <title>Pushpstation intro short</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link rel="stylesheet" href="brand.css" />
  <style>
    /* a panel in y 280-660: below the Shorts top bar, above the action centre */
    #panel { position: absolute; left: 50px; top: 290px; width: 980px; height: 360px; background: var(--color-ground); color: var(--color-ink); overflow: hidden; box-shadow: 14px 14px 0 var(--color-coral), 22px 22px 0 var(--color-shade); }
    #wall { top: -6px; }
    #mark { left: 90px; top: 330px; width: 140px; height: 140px; }
    #now { position: absolute; left: 262px; top: 334px; font-size: 38px; color: var(--color-volt); }
    #name-wrap { position: absolute; left: 258px; top: 384px; }
    #name { font-size: 76px; }
    #tag { left: 90px; top: 532px; height: 84px; font-size: 38px; box-shadow: 8px 8px 0 var(--color-shade); }
  </style>
</head>
<body>
  <div id="root" data-composition-id="intro-short" data-start="0" data-duration="2.6" data-width="1080" data-height="1920">
    <div id="grp" class="clip" data-start="0" data-duration="2.6" style="position:absolute;inset:0">
      <div id="panel"><div id="wall" class="wall"></div></div>
      <div id="mark" class="mark"></div>
      <div id="now" class="label">Now playing</div>
      <div id="name-wrap"><div id="name" class="head extrude" data-var-text="note">PS5 Gameplay</div></div>
      <div id="tag" class="tag" data-var-text="tag">PS5 gameplay</div>
    </div>
  </div>
  <script src="brand.js"></script>
  <script>
    document.fonts.ready.then(() => {
      const v = (window.__hyperframes && window.__hyperframes.getVariables()) || {};
      kind("#tag", v.kind || "gameplay");
      document.getElementById("wall").innerHTML = wallMarkup("Pushpstation", 5, 70);
      document.getElementById("mark").innerHTML = markMarkup(140);
      fit("#name", 730);
      splitChars("#name");
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#panel", { xPercent: -115, rotation: -6 }, { xPercent: 0, rotation: 0, duration: 0.4, ease: "back.out(1.5)" }, 0);
      wallDrift(tl, "#wall", 0, 2.6, 300);
      markIn(tl, "#mark", 0.22);
      tl.fromTo("#now", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 0.3);
      charsIn(tl, "#name", 0.32, 0.024);
      tagIn(tl, "#tag", 0.55);
      tl.to("#mark > svg", { rotation: 90, duration: 0.5, ease: "back.inOut(2)", stagger: 0.05 }, 1.4);
      tl.to(["#tag", "#name-wrap", "#now", "#mark", "#panel"], { x: 1250, rotation: 6, duration: 0.36, ease: "back.in(1.4)", stagger: 0.03 }, 2.05);
      window.__timelines["intro-short"] = tl;
    });
  </script>
</body>
</html>
