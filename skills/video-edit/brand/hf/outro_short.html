<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"line1","type":"string","label":"Big line","default":"Full video"},
  {"id":"line2","type":"string","label":"Second line","default":"on the channel"}
]'>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <meta name="description" content="Pushpstation Shorts end card, 9:16" />
  <title>Pushpstation outro short</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link rel="stylesheet" href="brand.css" />
  <style>
    /* content kept in x 100-900 so the Shorts like/comment column never covers it */
    #wall { top: 0; }
    #mark { left: 100px; top: 470px; width: 220px; height: 220px; }
    #name-wrap { position: absolute; left: 100px; top: 740px; }
    #name { font-size: 80px; }
    #l1-wrap { position: absolute; left: 100px; top: 860px; }
    #l1 { font-size: 132px; }
    #l2 { left: 100px; top: 1030px; height: 84px; font-size: 44px; background: var(--color-volt); color: var(--color-on-volt); box-shadow: 8px 8px 0 var(--color-shade); }
    #sub { left: 100px; top: 1190px; }
    #ring { position: absolute; inset: 0; overflow: visible; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="outro-short" data-start="0" data-duration="3.6" data-width="1080" data-height="1920">
    <div id="grp" class="clip" data-start="0" data-duration="3.6" style="position:absolute;inset:0">
      <div id="cover" class="cover">
        <div id="wall" class="wall"></div>
        <div id="mark" class="mark"></div>
        <div id="name-wrap"><div id="name" class="head extrude">Pushpstation</div></div>
        <div id="l1-wrap"><div id="l1" class="head extrude" data-var-text="line1">Full video</div></div>
        <div id="l2" class="tag" data-var-text="line2">on the channel</div>
        <div id="sub" class="subscribe"></div>
      </div>
      <svg id="ring" aria-hidden="true" viewBox="0 0 1080 1920"><path id="ring-p" d="M0 0Z" /></svg>
    </div>
  </div>
  <script src="brand.js"></script>
  <script>
    document.fonts.ready.then(() => {
      document.getElementById("wall").innerHTML = wallMarkup("Pushpstation", 16, 120);
      document.getElementById("mark").innerHTML = markMarkup(220);
      document.getElementById("sub").innerHTML = subscribeMarkup();
      fit("#l1", 860); fit("#name", 860);
      splitChars("#name"); splitChars("#l1");
      const tl = gsap.timeline({ paused: true });
      shapeCover(tl, "#cover", "#ring-p", "circle", 1080, 1920, 0, 0.36, null, 0);
      wallDrift(tl, "#wall", 0, 3.6, 500);
      markIn(tl, "#mark", 0.28);
      charsIn(tl, "#name", 0.34, 0.02);
      charsIn(tl, "#l1", 0.48, 0.03);
      tagIn(tl, "#l2", 0.66);
      subscribeAnim(tl, "#sub", 0.75);
      window.__timelines["outro-short"] = tl;
    });
  </script>
</body>
</html>
