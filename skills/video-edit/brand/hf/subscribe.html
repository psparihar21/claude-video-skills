<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <meta name="description" content="Pushpstation subscribe click, bottom centre overlay" />
  <title>Pushpstation subscribe</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link rel="stylesheet" href="brand.css" />
  <style> #sub { left: 698px; top: 870px; } </style>
</head>
<body>
  <!-- bottom-centre overlay for the sign-off line; 3.4 s -->
  <div id="root" data-composition-id="subscribe" data-start="0" data-duration="3.4" data-width="1920" data-height="1080">
    <div id="grp" class="clip" data-start="0" data-duration="3.4" style="position:absolute;inset:0">
      <div id="sub" class="subscribe"></div>
    </div>
  </div>
  <script src="brand.js"></script>
  <script>
    document.fonts.ready.then(() => {
      document.getElementById("sub").innerHTML = subscribeMarkup();
      const tl = gsap.timeline({ paused: true });
      subscribeAnim(tl, "#sub", 0);
      tl.to("#sub", { y: 260, rotation: 4, duration: 0.32, ease: "back.in(1.6)" }, 3.0);
      window.__timelines["subscribe"] = tl;
    });
  </script>
</body>
</html>
