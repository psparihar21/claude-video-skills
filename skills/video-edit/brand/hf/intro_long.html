<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"note","type":"string","label":"Game name","default":"PS5 Gameplay"},
  {"id":"tag","type":"string","label":"Tag","default":"PS5 gameplay"},
  {"id":"kind","type":"enum","label":"Kind of video","default":"gameplay","options":[{"value":"gameplay","label":"Gameplay (volt)"},{"value":"news","label":"News (coral)"},{"value":"tech","label":"Tech (sky)"}]}
]'>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <meta name="description" content="Pushpstation intro sting, 16:9" />
  <title>Pushpstation intro long</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link rel="stylesheet" href="brand.css" />
  <style>
    #wall { top: -20px; }
    #mark { left: 230px; top: 300px; width: 250px; height: 250px; }
    #name-wrap { position: absolute; left: 540px; top: 330px; }
    #name { font-size: 136px; }
    #now { position: absolute; left: 545px; top: 528px; font-size: 40px; color: var(--color-volt); }
    #game { left: 540px; top: 590px; height: 104px; font-size: 54px; background: var(--color-ink); color: var(--color-ground-deep); font-family: var(--font-display); font-weight: 900; text-transform: uppercase; box-shadow: 8px 8px 0 var(--color-shade); }
    #tag { top: 590px; height: 104px; font-size: 40px; box-shadow: 8px 8px 0 var(--color-shade); }
    #ring { position: absolute; inset: 0; overflow: visible; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="intro-long" data-start="0" data-duration="2.9" data-width="1920" data-height="1080">
    <div id="grp" class="clip" data-start="0" data-duration="2.9" style="position:absolute;inset:0">
      <div id="cover" class="cover">
        <div id="wall" class="wall"></div>
        <div id="mark" class="mark"></div>
        <div id="name-wrap"><div id="name" class="head extrude">Pushpstation</div></div>
        <div id="now" class="label">Now playing</div>
        <div id="game" class="tag" data-var-text="note">PS5 Gameplay</div>
        <div id="tag" class="tag" data-var-text="tag">PS5 gameplay</div>
      </div>
      <svg id="ring" aria-hidden="true" viewBox="0 0 1920 1080"><path id="ring-p" d="M0 0Z" /></svg>
    </div>
  </div>
  <script src="brand.js"></script>
  <script>
    document.fonts.ready.then(() => {
      const v = (window.__hyperframes && window.__hyperframes.getVariables()) || {};
      kind("#tag", v.kind || "gameplay");
      document.getElementById("wall").innerHTML = wallMarkup("Pushpstation", 7, 150);
      document.getElementById("mark").innerHTML = markMarkup(250);
      fit("#game", 900); fit("#name", 1250);
      const g = document.getElementById("game");
      document.getElementById("tag").style.left = (540 + g.offsetWidth + 24) + "px";
      splitChars("#name");
      const tl = gsap.timeline({ paused: true });
      shapeCover(tl, "#cover", "#ring-p", "triangle", 1920, 1080, 0, 0.38, 2.3, 0.5);
      wallDrift(tl, "#wall", 0, 2.9, 700);
      markIn(tl, "#mark", 0.3);
      charsIn(tl, "#name", 0.36, 0.028);
      tl.fromTo("#now", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 0.7);
      tagIn(tl, "#game", 0.78);
      tagIn(tl, "#tag", 0.92);
      tl.to("#mark > svg", { rotation: 90, duration: 0.5, ease: "back.inOut(2)", stagger: 0.05 }, 1.5);
      charsOut(tl, "#name", 2.1);
      tl.to(["#now", "#game", "#tag"], { xPercent: 120, opacity: 0, duration: 0.24, ease: "power3.in", stagger: 0.03 }, 2.08);
      tl.to("#mark > svg", { scale: 0, rotation: 200, duration: 0.24, ease: "power3.in", stagger: 0.03 }, 2.1);
      window.__timelines["intro-long"] = tl;
    });
  </script>
</body>
</html>
