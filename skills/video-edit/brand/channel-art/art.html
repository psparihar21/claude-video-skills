<!doctype html>
<!-- Pushpstation channel art (v4: cobalt, volt, coral, the four controller shapes). Open as art.html#<asset> at the asset's size; render_art.ps1 screenshots each one. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="description" content="Pushpstation channel art: profile pictures, YouTube banner, watermark, Instagram highlight covers" />
  <title>Pushpstation channel art</title>
  <link rel="stylesheet" href="../hf/brand.css" />
  <style>
    .art { position: absolute; left: 0; top: 0; overflow: hidden; display: none; background: var(--color-ground); }
    .art .wall { top: 0; }

    /* profile: 800 (YouTube) and 1080 (Instagram); the mark sits well inside the circle crop */
    #profile { width: var(--w); height: var(--w); }
    #profile .mark { left: 26%; top: 26%; width: 48%; height: 48%; }

    /* banner 2560x1440: everything that matters inside the 1546x423 safe area (507-2053, 508-931) */
    #banner { width: 2560px; height: 1440px; }
    #banner .mark { left: 560px; top: 540px; width: 210px; height: 210px; }
    #banner .name { position: absolute; left: 810px; top: 580px; font-size: 116px; }
    #banner .kinds { position: absolute; left: 810px; top: 790px; display: flex; gap: 24px; }
    #banner .kinds .tag { position: relative; height: 92px; font-size: 44px; box-shadow: 8px 8px 0 var(--color-shade); }
    #banner .hint { position: absolute; left: 560px; top: 820px; font-size: 40px; color: var(--color-volt); }
    #banner .big { position: absolute; }
    #banner .b1 { left: -120px; top: 240px; } #banner .b2 { left: 2140px; top: 520px; }

    /* watermark: 150x150 transparent, YouTube shows it bottom-right on every video */
    #watermark { width: 150px; height: 150px; background: transparent; }
    #watermark .mark { left: 15px; top: 15px; width: 120px; height: 120px; }

    /* Instagram highlight covers: 1080x1920; Instagram crops the centre circle */
    #hl { width: 1080px; height: 1920px; }
    #hl .center { position: absolute; left: 0; top: 660px; width: 1080px; height: 600px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; }
    #hl .center .mark { position: relative; width: 300px; height: 300px; }
    #hl .center .label-big { font-size: 96px; }
  </style>
</head>
<body>
  <div id="profile" class="art"><div class="wall"></div><div class="mark"></div></div>

  <div id="banner" class="art">
    <div class="wall"></div>
    <div class="big b1"></div><div class="big b2"></div>
    <div class="mark"></div>
    <div class="name head extrude">Pushpstation</div>
    <div class="kinds">
      <div class="tag k-gameplay">PS5 gameplay</div>
      <div class="tag k-news">Gaming news</div>
      <div class="tag k-tech">Tech</div>
    </div>
    <div class="hint label">In Hinglish</div>
  </div>

  <div id="watermark" class="art"><div class="mark"></div></div>

  <div id="hl" class="art"><div class="wall"></div><div class="center"><div class="mark"></div><div class="head extrude label-big"></div></div></div>

  <script src="../hf/brand.js"></script>
  <script>
    // #profile-800, #profile-1080, #banner, #watermark, #hl-<triangle|circle|cross|square|all>-<LABEL>
    document.fonts.ready.then(() => {
    const [name, a, b] = location.hash.slice(1).split("-");
    const el = document.getElementById(name);
    el.style.display = "block";
    if (name === "profile") el.style.setProperty("--w", a + "px");
    const W = el.offsetWidth;
    const wall = el.querySelector(".wall");
    if (wall) wall.innerHTML = wallMarkup("Pushpstation", Math.ceil(el.offsetHeight / (W * 0.12)) + 1, Math.round(W * 0.11));
    if (name === "hl" && a !== "all") el.querySelector(".mark").outerHTML = shapeSvg(a, 340);
    el.querySelectorAll(".mark").forEach((m) => (m.innerHTML = markMarkup(m.offsetWidth)));
    if (name === "banner") {
      el.querySelector(".b1").innerHTML = shapeSvg("triangle", 520, "line");
      el.querySelector(".b2").innerHTML = shapeSvg("circle", 420, "line");
      fit("#banner .name", 1200);
    }
    if (name === "hl") {
      el.querySelector(".label-big").textContent = decodeURIComponent(b);
      fit("#hl .label-big", 760);
    }
    });
  </script>
</body>
</html>
